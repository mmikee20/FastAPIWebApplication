version: '3'
services:
  backend-api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - fastapi-network

  frontend-server:
    build: ./frontend
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8000"
    networks:
      - fastapi-network
    depends_on:
      - backend-api

networks:
  fastapi-network:
    external: True
