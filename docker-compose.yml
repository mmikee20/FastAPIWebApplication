version: '3'
services:
  backend-api:
    #build: ./backend
    image: registry.hfmarkets.com:7443/devops/fastapiwebapplication_michalism/backend:live
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - fastapi-network

  frontend-server:
    #build: ./frontend
    image: registry.hfmarkets.com:7443/devops/fastapiwebapplication_michalism/frontend:live
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    volumes:
      - ./frontend:/app
    ports:
      - "8081:8000"
    networks:
      - fastapi-network
    depends_on:
      - backend-api

networks:
  fastapi-network:
    external: True
