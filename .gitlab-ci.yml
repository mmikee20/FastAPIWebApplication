stages:
  - build
  - deploy
  - test

variables:
  DOCKER_COMPOSE_VERSION: '1.29.2'
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:live
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:live

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

Build Image:
  stage: build
  script:
    - docker build -t $BACKEND_IMAGE ./backend
    - docker build -t $FRONTEND_IMAGE ./frontend
    - docker push $BACKEND_IMAGE
    - docker push $FRONTEND_IMAGE
  only:
    - main
  tags:
    - fast-api-michalis

Deploy:
  stage: deploy
  image: docker/compose:$DOCKER_COMPOSE_VERSION
  script:
    - docker-compose -f docker-compose.yml down
    - docker pull $BACKEND_IMAGE
    - docker pull $FRONTEND_IMAGE
    - docker-compose -f docker-compose.yml up -d
  only:
    - main
  tags:
    - fast-api-michalis

Test:
  stage: test
  image: docker/compose:1.29.2
  script:
    - apk add --no-cache curl
    - |
      if curl -s --head http://$FASTAPI_HOST:$FASTAPI_PORT/ | grep "200 OK" > /dev/null; then
        echo "The FastAPI application on port $FASTAPI_PORT is up and running."
      else
        echo "The FastAPI application on port $FASTAPI_PORT is not responding."
        exit 1
      fi
  variables:
    FASTAPI_HOST: "localhost"
    FASTAPI_PORT: "8000"
  only:
    - main
  tags:
    - fast-api-michalis
